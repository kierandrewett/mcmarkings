org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft 26.1+ ships unobfuscated, so there is no mappings dependency and no
# remap step. Loom must be the non-remapping plugin (net.fabricmc.fabric-loom).
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17.17
fabric_api_version=0.155.2+26.1.2


# fabric-gui-imgui declares minecraft "26.x", so 26.1.2 is in range.
imgui_version=26.1-1.0.11+imgui.1.92.0

# Pinned to what the wrapper was built against. Mixing in a newer imgui-java
# gives duplicate classes and mismatched natives.
imgui_java_version=1.92.0

# Rhino runs the sign generator scripts. Mozilla's own maven-central artefact.
rhino_version=1.7.15

mod_version=0.1.0
maven_group=dev.kierandrewett.mcmarkings
archives_base_name=mcmarkings-companion
